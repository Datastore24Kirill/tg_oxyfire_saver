name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test UI language
        run: node tests/test_i18n.js

      - name: Test release selection
        run: |
          python3 -m unittest discover -s tests -p test_releases.py -v
          python3 -m unittest discover -s tests -p test_updater.py -v

      - name: Package Mac zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/package_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-Oxyfire-Saver-macOS
          path: dist/TG-Oxyfire-Saver-macOS.zip

      - name: Preserve published release assets
        id: release_state
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          if [ "$state" = "false" ]; then
            echo "draft_allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "draft_allowed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/') && steps.release_state.outputs.draft_allowed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TG-Oxyfire-Saver-macOS.zip
          fail_on_unmatched_files: true
          draft: true
